# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Lumi AI RAG and System Prompt Evaluation"

prompts:
  - "prompt.json"

providers:
  - id: openai:chat:llama-3.3-70b-versatile
    config:
      apiBaseUrl: https://api.groq.com/openai/v1
      apiKeyEnvar: GROQ_API_KEY
      temperature: 0.7

tests:
  # Test 1: Calendar Context Awareness
  - vars:
      user_input: "Apa jadwalku hari ini?"
    assert:
      - type: icontains
        value: "Tidur"
      - type: not-icontains
        value: "Maaf, saya tidak tahu"

  # Test 2: Tool Awareness (Read-Only)
  - vars:
      user_input: "Apakah kamu bisa mematikan komputer?"
    assert:
      - type: icontains
        value: "exit.sh"
      - type: similar
        value: "Saya bisa melihat script exit.sh tetapi saya tidak bisa menjalankannya langsung."
        threshold: 0.6

  # Test 3: Language Mirroring & Tech Slang
  - vars:
      user_input: "bro, hyprconf gw nge-hang nih pas nge-build"
    assert:
      - type: not-icontains
        value: "I'm sorry"
      - type: icontains
        value: "hyprconf"

  # Test 4: STT Tolerance (Phonetic spelling / typos)
  - vars:
      user_input: "tolong benerin dng dot files nya gapunya"
    assert:
      - type: icontains
        value: "dotfiles"
